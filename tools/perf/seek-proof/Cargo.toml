[package]
name = "mirage-seek-proof-research"
version = "0.0.0"
edition = "2024"
publish = false

# Isolated research executable: does not change workspace dependencies/formats.
[workspace]

[dependencies]
mirage-types = { path = "../../../crates/mirage-types", default-features = false }
chacha20 = "=0.9.1"
chacha20poly1305 = "=0.10.1"
blake3 = "=1.8.7"
zeroize = "=1.9.0"
getrandom = "=0.3.4"
