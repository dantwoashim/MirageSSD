name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-gate:
    name: Windows x64 Gates
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with: { toolchain: '1.94.0' }

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: apps/mirage-ui/package-lock.json

      - name: Install pinned WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install wix --tool-path .tools/wix --version 4.0.6
          ".tools/wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Acquire verified WinFsp SDK
        shell: pwsh
        run: ./scripts/acquire-winfsp-sdk.ps1 -Output ./target/winfsp-sdk -WixExecutable ./.tools/wix/wix.exe

      - name: Install verified WinFsp runtime
        shell: pwsh
        run: |
          $uri = 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi'
          $path = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          Invoke-WebRequest -Uri $uri -OutFile $path
          $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          if ($actual -ne '073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A') { throw 'WinFsp checksum mismatch.' }
          $process = Start-Process msiexec.exe -ArgumentList @('/i', $path, '/qn', '/norestart') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "WinFsp installation failed: $($process.ExitCode)" }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Configure CMake Native Adapter
        run: cmake -S . -B build/windows-msvc-debug -A x64 "-DWINFSP_SDK_ROOT=${{ github.workspace }}/target/winfsp-sdk" -DMIRAGE_RUST_PROFILE=debug

      - name: Build CMake Native Adapter
        run: cmake --build --preset windows-msvc-debug

      - name: Run tests
        run: cargo test --workspace --locked -- --nocapture

      - name: Test and build management UI
        working-directory: apps/mirage-ui
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify native host artifact
        shell: pwsh
        run: |
          $hostPath = './build/windows-msvc-debug/native/winfsp-adapter/Debug/mirage-fs.exe'
          if (-not (Test-Path -LiteralPath $hostPath -PathType Leaf)) { throw "Missing native host: $hostPath" }

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-ci-diagnostics
          path: |
            build/windows-msvc-debug/CMakeFiles/CMakeError.log
            build/windows-msvc-debug/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore

  macos-gate:
    name: macOS Preview App Gates
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install macFUSE SDK
        run: brew install --cask macfuse

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      - name: Build pinned provider
        # GOTOOLCHAIN=auto fetches the exact toolchain pinned by rclone's go.mod if newer.
        env:
          GOTOOLCHAIN: auto
        run: ./scripts/build-rclone-miragessd.sh

      - name: Package app with CI placeholder registration
        # Never a real client: exercises compile, bundle, sign, and --check-package only.
        # The DMG is produced by release-macos; skipping it here avoids hdiutil flakiness.
        run: |
          printf '{"installed":{"client_id":"ci-placeholder.apps.googleusercontent.com","client_secret":"ci-placeholder","redirect_uris":["http://localhost"]}}' > "$RUNNER_TEMP/oauth-desktop.json"
          ./scripts/build-macos-app.sh --credentials "$RUNNER_TEMP/oauth-desktop.json" --output "$RUNNER_TEMP/packages" --no-dmg
          ls -l "$RUNNER_TEMP/packages"

  linux-gate:
    name: Linux Platform-Independent Gates
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with: { toolchain: '1.94.0' }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast
