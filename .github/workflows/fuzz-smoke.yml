name: fuzz-smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25
      - run: cargo +nightly-2026-08-25 install cargo-fuzz --version 0.13.2 --locked
      - working-directory: fuzz
        run: |
          for target in manifest commit midx pack_frame ipc_frame windows_path; do
            cargo +nightly-2026-08-25 fuzz run "$target" -- -max_total_time=10
          done
